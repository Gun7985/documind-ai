openapi: 3.1.0
info:
  title: DocuMind AI API
  version: 0.1.0
  description: |
    DocuMind AI MVP의 Spring Boot 공개 REST API 계약이다.
    모든 문서와 분석 자원은 인증된 사용자에게 격리된다.

    초기 업로드 정책은 파일당 최대 10MB, PDF 최대 30페이지이며 텍스트 기반 PDF만 지원한다.
    OCR, RAG, 결제 및 다중 문서 비교는 범위 밖이다.
servers:
  - url: https://api.example.invalid/api/v1
    description: Placeholder only; actual cloud endpoint requires validation.
tags:
  - name: Documents
  - name: Analyses
security:
  - bearerAuth: []
paths:
  /documents:
    post:
      tags: [Documents]
      summary: PDF 문서 업로드
      description: |
        텍스트 기반 PDF 하나를 private Storage에 업로드하고 문서 메타데이터를 생성한다.
        파일 크기는 최대 10MB이며 안전한 파싱 결과 최대 30페이지여야 한다.

        `Idempotency-Key`는 같은 사용자의 재전송을 하나의 문서 생성으로 수렴시킨다.
        같은 키와 같은 요청 fingerprint면 기존 응답을 반환하고, 같은 키에 다른 요청이면 409를 반환한다.
      operationId: uploadDocument
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: PDF binary; maximum 10MB (10,485,760 bytes).
                  x-max-size-bytes: 10485760
                  x-max-page-count: 30
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: 생략하면 정제된 원본 파일명을 기본 제목으로 사용한다.
            encoding:
              file:
                contentType: application/pdf
      responses:
        '201':
          description: 새 문서가 생성됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
        '200':
          description: 동일한 멱등 요청으로 이미 생성된 문서를 반환함
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessablePdf'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags: [Documents]
      summary: 내 문서 목록 조회
      description: 제목 또는 분석 키워드 검색, 최신 분석 상태 필터, 정렬 및 페이지네이션을 제공한다.
      operationId: listDocuments
      parameters:
        - name: q
          in: query
          description: 대소문자를 무시한 제목 prefix 또는 정규화된 분석 키워드 정확 일치 검색어
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: status
          in: query
          description: 최신 분석 작업 상태 필터
          schema:
            $ref: '#/components/schemas/AnalysisStatus'
        - name: sort
          in: query
          schema:
            type: string
            enum: [createdAt, updatedAt, title]
            default: createdAt
        - name: direction
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 소유 문서 페이지
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentPageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /documents/{documentId}:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      tags: [Documents]
      summary: 문서 상세 조회
      operationId: getDocument
      responses:
        '200':
          description: 문서 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/DocumentNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [Documents]
      summary: 문서 제목 수정
      operationId: updateDocumentTitle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDocumentTitleRequest'
      responses:
        '200':
          description: 수정된 문서
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/DocumentNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Documents]
      summary: 문서 삭제
      description: 원본 Storage 객체, 분석 작업과 결과를 함께 삭제한다. 반복 호출은 자원 존재 여부를 노출하지 않도록 404를 반환한다.
      operationId: deleteDocument
      responses:
        '204':
          description: 삭제 완료
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/DocumentNotFound'
        '409':
          description: 삭제를 안전하게 완료할 수 없는 일시적 자원 상태
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /documents/{documentId}/analyses:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    post:
      tags: [Analyses]
      summary: 분석 시작 또는 재분석
      description: |
        문서의 새 분석 작업을 요청한다. `Idempotency-Key`는 필수다.
        같은 키와 같은 요청이면 기존 작업을 반환하고, 같은 키에 다른 요청이면 409를 반환한다.
        해당 문서에 PENDING, EXTRACTING 또는 ANALYZING 작업이 이미 있으면 새 작업을 만들지 않고
        활성 작업을 200으로 반환한다. 따라서 문서당 활성 분석은 최대 하나다.
      operationId: startAnalysis
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartAnalysisRequest'
      responses:
        '202':
          description: 새 분석 작업 접수
          headers:
            Location:
              description: 생성된 분석 작업 상태 URL
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisJobResponse'
        '200':
          description: 멱등 재전송 또는 활성 작업 중복 방지로 기존 작업 반환
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisJobResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/DocumentNotFound'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          $ref: '#/components/responses/DocumentNotAnalyzable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/AiServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags: [Analyses]
      summary: 분석 이력 조회
      operationId: listAnalysisHistory
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 최신순 분석 작업 이력
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisHistoryPageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/DocumentNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /documents/{documentId}/analysis-result:
    parameters:
      - $ref: '#/components/parameters/DocumentId'
    get:
      tags: [Analyses]
      summary: 최신 완료 분석 결과 조회
      operationId: getLatestAnalysisResult
      responses:
        '200':
          description: 최신 완료 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisResultResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 문서가 없거나 소유하지 않았거나 완료된 결과가 없음
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /analysis-jobs/{jobId}:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      tags: [Analyses]
      summary: 분석 작업 상태 조회
      operationId: getAnalysisJob
      responses:
        '200':
          description: 분석 작업 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisJobResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/AnalysisJobNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /analysis-jobs/{jobId}/result:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      tags: [Analyses]
      summary: 특정 분석 이력의 결과 조회
      operationId: getAnalysisResult
      responses:
        '200':
          description: 해당 작업의 완료 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisResultResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 작업이 없거나 소유하지 않았거나 완료 결과가 없음
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: 작업이 아직 완료되지 않음
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Auth access JWT validated by Spring Security.
  parameters:
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 사용자와 operation 범위에서 유일한 불투명 키. 1~128자이며 비밀값을 포함하지 않는다.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'
    Page:
      name: page
      in: query
      description: 0부터 시작하는 페이지 번호
      schema:
        type: integer
        minimum: 0
        default: 0
    PageSize:
      name: size
      in: query
      description: 페이지당 항목 수
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  headers:
    IdempotentReplayed:
      description: 기존 자원을 반환했으면 true
      schema:
        type: boolean
  responses:
    BadRequest:
      description: 요청 형식 또는 파라미터가 잘못됨
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Bearer JWT가 없거나 유효하지 않음
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    DocumentNotFound:
      description: 문서가 없거나 인증 사용자가 소유하지 않음
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    AnalysisJobNotFound:
      description: 분석 작업이 없거나 인증 사용자가 소유하지 않음
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    IdempotencyConflict:
      description: 같은 멱등 키가 다른 요청 내용에 사용됨
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: 업로드가 초기 10MB 제한을 초과함
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: PDF가 아닌 파일 형식
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessablePdf:
      description: 손상, 암호화, 텍스트 없음 또는 30페이지 초과 등 처리할 수 없는 PDF
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    DocumentNotAnalyzable:
      description: 업로드 검증이 끝나지 않았거나 분석할 수 없는 문서
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: 사용자 요청 또는 분석 재시도 제한 초과
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    AiServiceUnavailable:
      description: 로컬 AI 서비스 또는 인증된 터널을 사용할 수 없음
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalServerError:
      description: 공개 가능한 세부정보가 없는 내부 오류
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    AnalysisStatus:
      type: string
      enum: [PENDING, EXTRACTING, ANALYZING, COMPLETED, FAILED]
    Document:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - originalFilename
        - mimeType
        - sizeBytes
        - pageCount
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        originalFilename:
          type: string
          minLength: 1
          maxLength: 255
        mimeType:
          type: string
          const: application/pdf
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          maximum: 10485760
        pageCount:
          type: integer
          minimum: 1
          maximum: 30
        latestAnalysisStatus:
          oneOf:
            - $ref: '#/components/schemas/AnalysisStatus'
            - type: 'null'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DocumentResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Document'
    UpdateDocumentTitleRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
    StartAnalysisRequest:
      type: object
      additionalProperties: false
      description: 향후 호환성을 위한 빈 옵션 객체. MVP에는 사용자 지정 모델/프롬프트가 없다.
      maxProperties: 0
    AnalysisJob:
      type: object
      additionalProperties: false
      required:
        - id
        - documentId
        - status
        - attemptNumber
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        documentId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/AnalysisStatus'
        attemptNumber:
          type: integer
          minimum: 1
        failure:
          oneOf:
            - $ref: '#/components/schemas/SafeFailure'
            - type: 'null'
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: [string, 'null']
          format: date-time
        completedAt:
          type: [string, 'null']
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SafeFailure:
      type: object
      additionalProperties: false
      required: [code, message, retryable]
      properties:
        code:
          type: string
          enum:
            - INVALID_PDF
            - ENCRYPTED_PDF
            - PAGE_LIMIT_EXCEEDED
            - SCANNED_PDF_UNSUPPORTED
            - TEXT_EXTRACTION_FAILED
            - AI_SERVICE_UNAVAILABLE
            - MODEL_TIMEOUT
            - MODEL_RESPONSE_INVALID
            - ANALYSIS_FAILED
        message:
          type: string
          maxLength: 500
        retryable:
          type: boolean
    AnalysisJobResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/AnalysisJob'
    Summary:
      type: object
      additionalProperties: false
      required: [text, sourcePages]
      properties:
        text:
          type: string
          minLength: 1
        sourcePages:
          $ref: '#/components/schemas/SourcePages'
    KeyPoint:
      type: object
      additionalProperties: false
      required: [text, sourcePages]
      properties:
        text:
          type: string
          minLength: 1
        sourcePages:
          $ref: '#/components/schemas/SourcePages'
    Keyword:
      type: object
      additionalProperties: false
      required: [term, sourcePages]
      properties:
        term:
          type: string
          minLength: 1
          maxLength: 100
        sourcePages:
          $ref: '#/components/schemas/SourcePages'
    SourcePages:
      type: array
      minItems: 1
      uniqueItems: true
      items:
        type: integer
        minimum: 1
        maximum: 30
    AnalysisResult:
      type: object
      additionalProperties: false
      required:
        - id
        - analysisJobId
        - documentId
        - schemaVersion
        - summary
        - keyPoints
        - keywords
        - warnings
        - modelName
        - pipelineVersion
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        analysisJobId:
          type: string
          format: uuid
        documentId:
          type: string
          format: uuid
        schemaVersion:
          type: string
          const: '1.0'
        summary:
          $ref: '#/components/schemas/Summary'
        keyPoints:
          type: array
          items:
            $ref: '#/components/schemas/KeyPoint'
        keywords:
          type: array
          items:
            $ref: '#/components/schemas/Keyword'
        warnings:
          type: array
          items:
            type: string
        modelName:
          type: string
          minLength: 1
        pipelineVersion:
          type: string
          minLength: 1
        createdAt:
          type: string
          format: date-time
    AnalysisResultResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/AnalysisResult'
    PageMetadata:
      type: object
      additionalProperties: false
      required: [page, size, totalElements, totalPages]
      properties:
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    DocumentPageResponse:
      type: object
      additionalProperties: false
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Document'
        page:
          $ref: '#/components/schemas/PageMetadata'
    AnalysisHistoryPageResponse:
      type: object
      additionalProperties: false
      required: [data, page]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AnalysisJob'
        page:
          $ref: '#/components/schemas/PageMetadata'
    Problem:
      type: object
      additionalProperties: false
      description: RFC 9457-style problem detail without sensitive internals.
      required: [type, title, status, code, traceId]
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]*$'
        detail:
          type: string
          maxLength: 500
        instance:
