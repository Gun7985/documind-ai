spring.application.name=backend
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.url=${FLYWAY_DATABASE_URL:${DATABASE_URL}}
spring.flyway.user=${FLYWAY_DATABASE_USERNAME:${DATABASE_USERNAME}}
spring.flyway.password=${FLYWAY_DATABASE_PASSWORD:${DATABASE_PASSWORD}}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

app.security.jwt.issuer=${SUPABASE_JWT_ISSUER}
app.security.jwt.jwk-set-uri=${SUPABASE_JWKS_URI}
app.security.jwt.audience=${SUPABASE_JWT_AUDIENCE:authenticated}
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
